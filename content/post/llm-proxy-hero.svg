<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <!-- Subtle noise texture for that aged hardware feel -->
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.08"/>
      </feComponentTransfer>
      <feBlend mode="multiply" in="SourceGraphic"/>
    </filter>
    <!-- Glow for active pins -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Wire wrap post -->
    <radialGradient id="pinGold" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#f0d060"/>
      <stop offset="100%" stop-color="#8a7030"/>
    </radialGradient>
    <radialGradient id="pinSilver" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#d0d0d0"/>
      <stop offset="100%" stop-color="#606060"/>
    </radialGradient>
    <!-- PCB green -->
    <linearGradient id="pcbGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a3a1a"/>
      <stop offset="100%" stop-color="#0d2a0d"/>
    </linearGradient>
  </defs>

  <!-- Dark background -->
  <rect width="1200" height="675" fill="#0a0a0a"/>

  <!-- PCB board base -->
  <rect x="40" y="40" width="1120" height="595" rx="4" fill="url(#pcbGreen)" opacity="0.95"/>

  <!-- PCB trace lines (faint copper traces) -->
  <g stroke="#2a5a2a" stroke-width="0.5" opacity="0.4">
    <!-- Horizontal traces -->
    <line x1="60" y1="80" x2="1140" y2="80"/>
    <line x1="60" y1="120" x2="1140" y2="120"/>
    <line x1="60" y1="160" x2="1140" y2="160"/>
    <line x1="60" y1="200" x2="1140" y2="200"/>
    <line x1="60" y1="240" x2="1140" y2="240"/>
    <line x1="60" y1="280" x2="1140" y2="280"/>
    <line x1="60" y1="320" x2="1140" y2="320"/>
    <line x1="60" y1="360" x2="1140" y2="360"/>
    <line x1="60" y1="400" x2="1140" y2="400"/>
    <line x1="60" y1="440" x2="1140" y2="440"/>
    <line x1="60" y1="480" x2="1140" y2="480"/>
    <line x1="60" y1="520" x2="1140" y2="520"/>
    <line x1="60" y1="560" x2="1140" y2="560"/>
    <line x1="60" y1="600" x2="1140" y2="600"/>
    <!-- Vertical traces -->
    <line x1="100" y1="60" x2="100" y2="620"/>
    <line x1="160" y1="60" x2="160" y2="620"/>
    <line x1="220" y1="60" x2="220" y2="620"/>
    <line x1="280" y1="60" x2="280" y2="620"/>
    <line x1="340" y1="60" x2="340" y2="620"/>
    <line x1="400" y1="60" x2="400" y2="620"/>
    <line x1="460" y1="60" x2="460" y2="620"/>
    <line x1="520" y1="60" x2="520" y2="620"/>
    <line x1="580" y1="60" x2="580" y2="620"/>
    <line x1="640" y1="60" x2="640" y2="620"/>
    <line x1="700" y1="60" x2="700" y2="620"/>
    <line x1="760" y1="60" x2="760" y2="620"/>
    <line x1="820" y1="60" x2="820" y2="620"/>
    <line x1="880" y1="60" x2="880" y2="620"/>
    <line x1="940" y1="60" x2="940" y2="620"/>
    <line x1="1000" y1="60" x2="1000" y2="620"/>
    <line x1="1060" y1="60" x2="1060" y2="620"/>
    <line x1="1120" y1="60" x2="1120" y2="620"/>
  </g>

  <!-- === WIRE WRAP CONNECTIONS === -->
  <!-- These are the beautiful chaotic wires. Colors: red, blue, yellow, white, orange, green -->

  <!-- Layer 1: Background wires (thinner, more muted) -->
  <g fill="none" stroke-width="1.2" opacity="0.5">
    <path d="M120,100 C180,80 240,150 300,120" stroke="#cc3333"/>
    <path d="M200,180 C260,220 350,160 400,200" stroke="#3366cc"/>
    <path d="M80,300 C150,280 200,350 280,320" stroke="#cccc33"/>
    <path d="M500,100 C560,140 620,80 680,120" stroke="#ffffff"/>
    <path d="M700,200 C760,160 820,240 880,200" stroke="#cc6633"/>
    <path d="M900,300 C960,340 1020,280 1080,320" stroke="#33cc66"/>
    <path d="M150,450 C220,420 280,500 350,460" stroke="#cc3333"/>
    <path d="M400,500 C470,540 530,480 600,520" stroke="#3366cc"/>
    <path d="M650,400 C720,440 780,380 850,420" stroke="#cccc33"/>
    <path d="M300,550 C380,520 440,590 520,560" stroke="#ffffff"/>
    <path d="M800,500 C870,540 930,480 1000,520" stroke="#cc6633"/>
    <path d="M1000,100 C1040,140 1080,90 1120,130" stroke="#33cc66"/>
    <path d="M100,550 C170,510 230,580 300,540" stroke="#9966cc"/>
    <path d="M750,550 C820,590 880,530 950,570" stroke="#9966cc"/>
  </g>

  <!-- Layer 2: Mid wires -->
  <g fill="none" stroke-width="1.8" opacity="0.7">
    <!-- Red wires - left cluster to center -->
    <path d="M100,160 C200,120 300,200 460,180 S560,140 600,280" stroke="#e04040"/>
    <path d="M100,240 C180,280 280,200 400,260 S500,300 600,320" stroke="#e04040"/>
    <path d="M100,400 C200,360 320,420 460,380 S540,340 600,340" stroke="#e04040"/>

    <!-- Blue wires - left cluster to center -->
    <path d="M100,200 C220,160 340,240 460,200 S560,220 600,300" stroke="#4488ee"/>
    <path d="M100,320 C200,350 300,290 420,330 S520,360 600,360" stroke="#4488ee"/>
    <path d="M100,480 C220,440 340,500 460,460 S540,420 600,380" stroke="#4488ee"/>

    <!-- Yellow wires - center to right cluster -->
    <path d="M600,280 C700,240 780,300 880,260 S980,220 1100,200" stroke="#eedd44"/>
    <path d="M600,320 C720,350 800,290 900,330 S1000,370 1100,320" stroke="#eedd44"/>
    <path d="M600,340 C680,380 780,340 860,380 S960,420 1100,400" stroke="#eedd44"/>

    <!-- White wires - center to right cluster -->
    <path d="M600,300 C700,260 800,320 920,280 S1020,240 1100,160" stroke="#dddddd"/>
    <path d="M600,360 C720,400 820,350 940,390 S1040,360 1100,280" stroke="#dddddd"/>
    <path d="M600,380 C700,420 800,380 900,430 S1000,470 1100,480" stroke="#dddddd"/>

    <!-- Orange cross-wires -->
    <path d="M160,120 C300,160 500,100 600,280 S700,400 900,160" stroke="#ee8833"/>
    <path d="M160,520 C300,480 500,540 600,380 S700,240 900,520" stroke="#ee8833"/>

    <!-- Green cross-wires -->
    <path d="M220,80 C380,140 460,60 600,300 S740,540 1060,580" stroke="#44bb66"/>
    <path d="M220,580 C380,520 460,600 600,340 S740,120 1060,80" stroke="#44bb66"/>
  </g>

  <!-- Layer 3: Feature wires (thick, prominent) — these represent the main routing paths -->
  <g fill="none" stroke-width="2.5" opacity="0.9">
    <!-- THE MAIN PROXY ROUTES — thick, vibrant -->
    <!-- App -> Proxy (red bundle) -->
    <path d="M140,280 C220,250 320,310 440,270 Q520,240 580,290" stroke="#ff4444" stroke-width="3"/>
    <path d="M140,320 C240,340 340,290 440,330 Q520,360 580,330" stroke="#ff5555" stroke-width="2.8"/>
    <path d="M140,360 C220,390 320,340 440,380 Q520,370 580,350" stroke="#ff6666" stroke-width="2.6"/>

    <!-- Proxy -> Provider A (blue) -->
    <path d="M620,290 C700,260 800,300 900,260 Q1000,230 1060,180" stroke="#4499ff" stroke-width="3"/>
    <path d="M620,310 C720,280 820,320 920,280 Q1000,250 1060,220" stroke="#55aaff" stroke-width="2.8"/>

    <!-- Proxy -> Provider B (green) -->
    <path d="M620,330 C720,360 800,330 880,360 Q960,380 1060,340" stroke="#44dd77" stroke-width="3"/>
    <path d="M620,350 C720,380 800,350 880,380 Q960,400 1060,380" stroke="#55ee88" stroke-width="2.8"/>

    <!-- Proxy -> Provider C (orange) -->
    <path d="M620,370 C700,400 800,380 880,420 Q960,450 1060,480" stroke="#ff8844" stroke-width="3"/>
    <path d="M620,380 C700,420 800,400 880,440 Q960,470 1060,520" stroke="#ff9955" stroke-width="2.8"/>
  </g>

  <!-- === WIRE WRAP PINS === -->
  <!-- Left cluster - "Application" pins -->
  <g>
    <circle cx="140" cy="160" r="4" fill="url(#pinGold)"/>
    <circle cx="140" cy="200" r="4" fill="url(#pinGold)"/>
    <circle cx="140" cy="240" r="4" fill="url(#pinGold)"/>
    <circle cx="140" cy="280" r="4" fill="url(#pinGold)" filter="url(#glow)"/>
    <circle cx="140" cy="320" r="4" fill="url(#pinGold)" filter="url(#glow)"/>
    <circle cx="140" cy="360" r="4" fill="url(#pinGold)" filter="url(#glow)"/>
    <circle cx="140" cy="400" r="4" fill="url(#pinGold)"/>
    <circle cx="140" cy="440" r="4" fill="url(#pinGold)"/>
    <circle cx="140" cy="480" r="4" fill="url(#pinGold)"/>
    <circle cx="140" cy="520" r="4" fill="url(#pinGold)"/>
  </g>

  <!-- Center cluster - "Proxy" pins (the hub) -->
  <g>
    <!-- Left side of proxy -->
    <circle cx="580" cy="200" r="4" fill="url(#pinGold)"/>
    <circle cx="580" cy="240" r="4" fill="url(#pinGold)"/>
    <circle cx="580" cy="280" r="5" fill="url(#pinGold)" filter="url(#glow)"/>
    <circle cx="580" cy="320" r="5" fill="url(#pinGold)" filter="url(#glow)"/>
    <circle cx="580" cy="340" r="5" fill="url(#pinGold)" filter="url(#glow)"/>
    <circle cx="580" cy="380" r="4" fill="url(#pinGold)"/>
    <circle cx="580" cy="420" r="4" fill="url(#pinGold)"/>
    <circle cx="580" cy="460" r="4" fill="url(#pinGold)"/>
    <!-- Right side of proxy -->
    <circle cx="620" cy="200" r="4" fill="url(#pinGold)"/>
    <circle cx="620" cy="240" r="4" fill="url(#pinGold)"/>
    <circle cx="620" cy="280" r="5" fill="url(#pinGold)" filter="url(#glow)"/>
    <circle cx="620" cy="320" r="5" fill="url(#pinGold)" filter="url(#glow)"/>
    <circle cx="620" cy="340" r="5" fill="url(#pinGold)" filter="url(#glow)"/>
    <circle cx="620" cy="360" r="5" fill="url(#pinGold)" filter="url(#glow)"/>
    <circle cx="620" cy="380" r="5" fill="url(#pinGold)" filter="url(#glow)"/>
    <circle cx="620" cy="420" r="4" fill="url(#pinGold)"/>
    <circle cx="620" cy="460" r="4" fill="url(#pinGold)"/>
  </g>

  <!-- Right cluster - "Provider" pins -->
  <g>
    <!-- Provider A (top) -->
    <circle cx="1060" cy="120" r="4" fill="url(#pinSilver)"/>
    <circle cx="1060" cy="160" r="4" fill="url(#pinSilver)"/>
    <circle cx="1060" cy="180" r="5" fill="url(#pinSilver)" filter="url(#glow)"/>
    <circle cx="1060" cy="220" r="5" fill="url(#pinSilver)" filter="url(#glow)"/>
    <circle cx="1060" cy="260" r="4" fill="url(#pinSilver)"/>
    <!-- Provider B (middle) -->
    <circle cx="1060" cy="320" r="4" fill="url(#pinSilver)"/>
    <circle cx="1060" cy="340" r="5" fill="url(#pinSilver)" filter="url(#glow)"/>
    <circle cx="1060" cy="380" r="5" fill="url(#pinSilver)" filter="url(#glow)"/>
    <circle cx="1060" cy="420" r="4" fill="url(#pinSilver)"/>
    <!-- Provider C (bottom) -->
    <circle cx="1060" cy="460" r="4" fill="url(#pinSilver)"/>
    <circle cx="1060" cy="480" r="5" fill="url(#pinSilver)" filter="url(#glow)"/>
    <circle cx="1060" cy="520" r="5" fill="url(#pinSilver)" filter="url(#glow)"/>
    <circle cx="1060" cy="560" r="4" fill="url(#pinSilver)"/>
  </g>

  <!-- Extra scattered pins for realism -->
  <g opacity="0.6">
    <circle cx="220" cy="120" r="3" fill="url(#pinSilver)"/>
    <circle cx="280" cy="200" r="3" fill="url(#pinSilver)"/>
    <circle cx="340" cy="160" r="3" fill="url(#pinSilver)"/>
    <circle cx="400" cy="280" r="3" fill="url(#pinSilver)"/>
    <circle cx="460" cy="200" r="3" fill="url(#pinSilver)"/>
    <circle cx="460" cy="440" r="3" fill="url(#pinSilver)"/>
    <circle cx="340" cy="520" r="3" fill="url(#pinSilver)"/>
    <circle cx="700" cy="160" r="3" fill="url(#pinSilver)"/>
    <circle cx="760" cy="240" r="3" fill="url(#pinSilver)"/>
    <circle cx="820" cy="440" r="3" fill="url(#pinSilver)"/>
    <circle cx="880" cy="160" r="3" fill="url(#pinSilver)"/>
    <circle cx="940" cy="520" r="3" fill="url(#pinSilver)"/>
    <circle cx="760" cy="540" r="3" fill="url(#pinSilver)"/>
    <circle cx="400" cy="400" r="3" fill="url(#pinSilver)"/>
    <circle cx="280" cy="440" r="3" fill="url(#pinSilver)"/>
    <circle cx="820" cy="120" r="3" fill="url(#pinSilver)"/>
    <circle cx="940" cy="280" r="3" fill="url(#pinSilver)"/>
    <circle cx="700" cy="480" r="3" fill="url(#pinSilver)"/>
  </g>

  <!-- === IC CHIP — the "proxy" at center === -->
  <rect x="585" y="250" width="30" height="140" rx="2" fill="#1a1a1a" stroke="#333" stroke-width="1"/>
  <!-- Chip notch -->
  <circle cx="600" cy="255" r="4" fill="none" stroke="#333" stroke-width="0.8"/>
  <!-- Chip pins left -->
  <rect x="578" y="270" width="10" height="3" fill="#888"/>
  <rect x="578" y="290" width="10" height="3" fill="#888"/>
  <rect x="578" y="310" width="10" height="3" fill="#888"/>
  <rect x="578" y="330" width="10" height="3" fill="#888"/>
  <rect x="578" y="350" width="10" height="3" fill="#888"/>
  <rect x="578" y="370" width="10" height="3" fill="#888"/>
  <!-- Chip pins right -->
  <rect x="612" y="270" width="10" height="3" fill="#888"/>
  <rect x="612" y="290" width="10" height="3" fill="#888"/>
  <rect x="612" y="310" width="10" height="3" fill="#888"/>
  <rect x="612" y="330" width="10" height="3" fill="#888"/>
  <rect x="612" y="350" width="10" height="3" fill="#888"/>
  <rect x="612" y="370" width="10" height="3" fill="#888"/>

  <!-- Small DIP chips scattered -->
  <g opacity="0.6">
    <rect x="300" y="170" width="20" height="50" rx="1" fill="#1a1a1a" stroke="#333" stroke-width="0.5"/>
    <rect x="440" y="420" width="20" height="50" rx="1" fill="#1a1a1a" stroke="#333" stroke-width="0.5"/>
    <rect x="760" y="130" width="20" height="50" rx="1" fill="#1a1a1a" stroke="#333" stroke-width="0.5"/>
    <rect x="880" y="400" width="20" height="50" rx="1" fill="#1a1a1a" stroke="#333" stroke-width="0.5"/>
  </g>

  <!-- === LABELS === -->
  <!-- These are etched into the PCB, like silkscreen printing -->
  <g font-family="'Courier New', monospace" fill="#3a6a3a" font-size="11" opacity="0.7">
    <text x="105" y="145">APP</text>
    <text x="1045" y="110">PROVIDER_A</text>
    <text x="1045" y="305">PROVIDER_B</text>
    <text x="1045" y="448">PROVIDER_C</text>
  </g>

  <!-- Main chip label -->
  <text x="600" y="325" font-family="'Courier New', monospace" font-size="8" fill="#44aa44" text-anchor="middle" transform="rotate(90, 600, 320)" letter-spacing="2">PROXY</text>

  <!-- === TITLE TEXT overlay === -->
  <g>
    <!-- Dark backdrop strip for text legibility -->
    <rect x="0" y="0" width="1200" height="56" fill="#0a0a0a" opacity="0.85"/>
    <rect x="0" y="619" width="1200" height="56" fill="#0a0a0a" opacity="0.85"/>

    <!-- Title -->
    <text x="600" y="38" font-family="'Courier New', monospace" font-size="22" fill="#44dd77" text-anchor="middle" letter-spacing="3" font-weight="bold">LLM PROXIES: THE API GATEWAYS OF THE AI ERA</text>

    <!-- Subtitle -->
    <text x="600" y="652" font-family="'Courier New', monospace" font-size="14" fill="#88aa88" text-anchor="middle" letter-spacing="2">ROUTING &middot; FAILOVER &middot; MONITORING &middot; CACHING &middot; GOVERNANCE</text>
  </g>

  <!-- Noise overlay for texture -->
  <rect width="1200" height="675" filter="url(#noise)" opacity="0.3"/>
</svg>
